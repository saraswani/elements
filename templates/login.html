<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Verifiable SSE Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            background-color: #1e293b;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-icon {
            font-size: 3rem;
            color: #3b82f6;
            margin-bottom: 1rem;
        }
        .btn-google {
            background-color: #fff;
            color: #475569;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
            margin-top: 2rem;
        }
        .btn-google:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .btn-google img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <i class="bi bi-shield-lock login-icon"></i>
        <h2 class="mb-3">Verifiable SSE Engine</h2>
        <p class="text-secondary">Securely encrypt and search your documents.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} mt-3" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <a href="{{ url_for('auth_google') }}" class="btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
            Login with Google
        </a>
    </div>

</body>
</html>
